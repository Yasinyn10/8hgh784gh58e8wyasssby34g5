<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدمج - 4 مستويات</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            text-align: center;
        }
        header { padding: 20px; background: rgba(0,0,0,0.6); }
        h1 { margin: 0; font-size: 2.8em; text-shadow: 0 0 15px #00ffcc; }

        #menu { padding: 40px; display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; }
        .level-btn {
            width: 210px; height: 210px;
            background: #0f3460; border: 5px solid #00ffcc;
            border-radius: 25px; display: flex; align-items: center; justify-content: center;
            font-size: 1.6em; cursor: pointer; transition: 0.3s;
        }
        .level-btn:hover { transform: scale(1.08); }
        .level-btn.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(70%); }

        #game-container {
            display: none; margin: 20px auto; max-width: 820px;
            background: #000; border: 6px solid #00ffcc; border-radius: 20px;
            overflow: hidden; position: relative;
        }
        canvas { display: block; background: #0a1f3d; }

        #ui {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; z-index: 100; flex-wrap: wrap;
        }
        .info { 
            background: rgba(0,0,0,0.75); padding: 10px 18px; 
            border-radius: 12px; font-size: 1.25em; margin: 3px;
        }

        .controls { 
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 100; 
        }
        button {
            background: #e94560; color: white; border: none;
            padding: 12px 24px; margin: 5px; border-radius: 50px; font-size: 1.1em; cursor: pointer;
        }
    </style>
</head>
<body>

    <header><h1>🎮 لعبة الدمج</h1></header>

    <div id="menu">
        <div class="level-btn" onclick="startLevel(1)">المستوى 1</div>
        <div class="level-btn locked" id="lvl2" onclick="startLevel(2)">المستوى 2</div>
        <div class="level-btn locked" id="lvl3" onclick="startLevel(3)">المستوى 3</div>
        <div class="level-btn locked" id="lvl4" onclick="startLevel(4)">المستوى 4</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui">
            <div class="info">المستوى: <span id="levelNum">1</span></div>
            <div class="info">النتيجة: <span id="score">0</span></div>
            <div class="info">الدمج: <span id="merges">0</span>/10</div>
            <div class="info">الفائت: <span id="misses">0</span>/20</div>
        </div>

        <div class="controls">
            <button onclick="toggleMusic()">🎵 تشغيل/إيقاف الموسيقى</button>
            <button onclick="endGame()">خروج</button>
        </div>
    </div>

    <!-- الموسيقى الخلفية -->
    <audio id="bgMusic" loop>
        <!-- غير الرابط هنا بأغنية تريدها -->
        <source src="sound.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const music = document.getElementById('bgMusic');

        // ====================== أضف صور المستويات هنا ======================
        const levelsData = [
            null,
            {                 char: "مصطفى.jpg",     // شخصية المستوى 1
                proj: "penis.png"  },
            {   char: "يحيى.jpg",   // شخصية المستوى 2
                proj: "penis.png" },
            {          char: "يزن.jpg",    // شخصية المستوى 3
                proj: "penis.png" },
            {          char: "يوسف.png",    // شخصية المستوى 4
                proj: "penis.png"}
        ];
        // =================================================================

        let currentLevel = 1, score = 0, merges = 0, misses = 0, gameRunning = false;
        let characterImg = new Image(), projectileImg = new Image();
        
        let character = { x: 340, y: 80, width: 140, height: 140, speed: 3, direction: 1 };
        let projectiles = [];
        let particles = [];

        function startLevel(level) {
            if (level > 1 && document.getElementById(`lvl${level}`).classList.contains('locked')) {
                alert("أكمل المستوى السابق أولاً!");
                return;
            }

            currentLevel = level;
            const data = levelsData[level];
            characterImg.src = data.char;
            projectileImg.src = data.proj;

            character.speed = 2.5 + (level * 2.3);
            score = 0; merges = 0; misses = 0; projectiles = [];

            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('levelNum').textContent = level;

            updateUI();
            music.play().catch(() => {}); // تشغيل الموسيقى
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('merges').textContent = merges;
            document.getElementById('misses').textContent = misses;
        }

        canvas.addEventListener('click', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            projectiles.push({ x: clickX, y: 550, width: 60, height: 60, speed: 11 });
        });

        function createMergeEffect(x, y) {
            for (let i = 0; i < 35; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 14 - 3,
                    life: 48,
                    color: `hsl(${Math.random()*50 + 10}, 100%, 65%)`
                });
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0a1f3d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1e3a5f';
            ctx.fillRect(0, 550, canvas.width, 50);

            // الشخصية
            character.x += character.speed * character.direction;
            if (character.x <= 20 || character.x >= canvas.width - character.width - 20) character.direction *= -1;
            ctx.drawImage(characterImg, character.x, character.y, character.width, character.height);

            // الرميات
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.y -= p.speed;

                ctx.drawImage(projectileImg, p.x - 30, p.y - 30, p.width, p.height);

                // تصادم
                if (p.x > character.x && p.x < character.x + character.width &&
                    p.y > character.y && p.y < character.y + character.height + 40) {
                    
                    projectiles.splice(i, 1);
                    score += 120 + currentLevel * 70;
                    merges++;
                    updateUI();
                    createMergeEffect(p.x, p.y);

                    if (merges >= 10) { setTimeout(completeLevel, 400); return; }
                }

                // فائتة (خرجت من أعلى الشاشة)
                if (p.y < -60) {
                    projectiles.splice(i, 1);
                    misses++;
                    updateUI();
                    if (misses >= 20) {
                        gameOver();
                        return;
                    }
                }
            }

            // تأثيرات
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.life--;
                ctx.globalAlpha = p.life / 48;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 11, 11);
                if (p.life <= 0) particles.splice(i, 1);
            }
            ctx.globalAlpha = 1;

            requestAnimationFrame(gameLoop);
        }

        function completeLevel() {
            gameRunning = false;
            music.pause();
            if (currentLevel < 4) {
                alert(`🎉 أكملت المستوى ${currentLevel} بنجاح!`);
                document.getElementById(`lvl${currentLevel + 1}`).classList.remove('locked');
            } else {
                alert("🏆 تهانينا! أكملت جميع المستويات");
            }
            endGame();
        }

        function gameOver() {
            gameRunning = false;
            music.pause();
            alert(`💥 خسرت!\nوصلت إلى 20 رمية فائتة.\nالنتيجة: ${score}`);
            endGame();
        }

        function toggleMusic() {
            if (music.paused) music.play();
            else music.pause();
        }

        function endGame() {
            gameRunning = false;
            music.pause();
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
        }
    </script>
</body>
</html>
